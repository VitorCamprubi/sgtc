# =============================================================
# SGTC - docker-compose
#
# Uso (dev):
#   cp .env.example .env  &&  docker compose up -d
#
# Uso (prod):
#   Configure todas as variaveis em .env (sem fallbacks).
#   SPRING_PROFILES_ACTIVE=prod docker compose up -d
# =============================================================

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - sgtc_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Adminer so e' subido com o profile "tools".
  # Use:  docker compose --profile tools up -d
  adminer:
    image: adminer:latest
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mysql

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@sgtc.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SGTC}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      APP_API_URL: ${APP_API_URL:-http://localhost:8080}
      APP_WEB_URL: ${APP_WEB_URL:-http://localhost:4200}
      APP_UPLOAD_DIR: /var/sgtc/uploads
      JAVA_OPTS: ${JAVA_OPTS:-}
    ports:
      - "8080:8080"
    volumes:
      - sgtc_uploads:/var/sgtc/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/ping >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    # Em prod a porta nao precisa ser exposta - Caddy fala com o frontend
    # pela rede interna do compose. Mantida em dev para acesso direto.
    ports:
      - "4200:80"

  # Reverse proxy + TLS automatico via Let's Encrypt.
  # Suba com:  docker compose --profile https up -d
  # Em prod, definir SGTC_DOMAIN no .env (ex: sgtc.fatectatui.edu.br)
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - sgtc_caddy_data:/data
      - sgtc_caddy_config:/config
    environment:
      SGTC_DOMAIN: ${SGTC_DOMAIN:-:80}
    depends_on:
      - frontend
      - backend

volumes:
  sgtc_mysql_data:
  sgtc_uploads:
  sgtc_caddy_data:
  sgtc_caddy_config:
