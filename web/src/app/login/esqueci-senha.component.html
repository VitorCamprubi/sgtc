<section class="login-page">
  <div class="login-card">
    <div class="brand">
      <span class="brand-name">Fatec</span>
      <span class="brand-city">Tatuí</span>
    </div>
    <p class="brand-campus">Recuperação de senha</p>

    <p class="info-message" *ngIf="!message">
      Informe seu e-mail cadastrado e enviaremos um link para redefinir sua senha.
    </p>
    <p *ngIf="message" class="info-message" role="status">{{ message }}</p>

    <form (ngSubmit)="submit()" autocomplete="on" novalidate *ngIf="!message">
      <label class="sr-only" for="email">E-mail</label>
      <input
        id="email"
        name="email"
        [(ngModel)]="email"
        type="email"
        placeholder="Digite seu e-mail"
        autocomplete="email"
        required
      />
      <button type="submit" [disabled]="loading">
        {{ loading ? 'Enviando...' : 'Enviar link de recuperação' }}
      </button>
      <p *ngIf="error" class="error-message" role="alert">{{ error }}</p>
    </form>

    <p class="forgot-password-link">
      <a routerLink="/login">Voltar ao login</a>
    </p>
  </div>
</section>
