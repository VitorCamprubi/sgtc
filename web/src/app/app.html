<div class="app-shell">
  <header class="app-header" *ngIf="isLoggedIn">
    <div class="brand-block">
      <span class="brand-title">SGTC</span>
      <span class="brand-subtitle">Fatec Tatuí</span>
    </div>

    <nav class="primary-nav">
      <a routerLink="/grupos" routerLinkActive="active">Grupos</a>
      <a *ngIf="isAdminLinkVisible" routerLink="/admin/usuarios" routerLinkActive="active">Admin</a>
    </nav>

    <div class="session-info">
      <span>Logado como <strong>{{ userEmail ?? '-' }}</strong></span>
      <button type="button" (click)="logout()">Sair</button>
    </div>
  </header>

  <main class="app-main" [class.app-main--auth]="!isLoggedIn">
    <router-outlet />
  </main>
</div>
