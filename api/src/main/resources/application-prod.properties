# =============================================================
# Perfil PROD - sobreposicoes ao application.properties
# Ative com: SPRING_PROFILES_ACTIVE=prod
# =============================================================

# --- DB ---
# Em prod, NAO ha fallback de credencial. Se faltar, a app nao sobe.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# --- JPA ---
# Flyway gerencia o schema; Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# --- Upload ---
# Em prod, use um caminho absoluto montado como volume e com backup.
app.upload.dir=${APP_UPLOAD_DIR:/var/sgtc/uploads}

# --- JWT ---
# Sem fallback: o JwtService rejeita o secret de dev em prod.
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# --- CORS ---
# Pode aceitar multiplos hosts separados por virgula via env var.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# --- E-mail ---
# Em prod, credenciais SMTP sao obrigatorias.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
app.mail.from=${MAIL_FROM}
app.mail.from-name=${MAIL_FROM_NAME:SGTC}
app.mail.enabled=${MAIL_ENABLED:true}

# --- URLs publicas (links em emails) ---
app.url.api=${APP_API_URL}
app.url.web=${APP_WEB_URL}

# --- Logging ---
logging.level.root=INFO
logging.level.com.vitorcamprubi.sgtc=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=INFO
