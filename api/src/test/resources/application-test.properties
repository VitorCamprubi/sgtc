# =============================================================
# Perfil de teste: H2 em memoria, sem SMTP, sem Flyway.
# Usado pelo SgtcApplicationTests via @ActiveProfiles("test").
# =============================================================

# --- DB: H2 em memoria, modo MySQL ---
spring.datasource.url=jdbc:h2:mem:sgtc-test;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA: Hibernate cria o schema (Flyway desativado em teste) ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# --- Flyway desativado em teste ---
spring.flyway.enabled=false

# --- Email desligado em teste ---
app.mail.enabled=false
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=

# --- JWT: precisa ter >= 32 bytes (validado pelo JwtService) ---
security.jwt.secret=test-only-jwt-secret-with-more-than-32-bytes-of-length-XYZ
security.jwt.expiration-minutes=60

# --- URLs / CORS ---
app.url.api=http://localhost:8080
app.url.web=http://localhost:4200
app.cors.allowed-origins=http://localhost:4200

# --- Upload em diretorio temporario ---
app.upload.dir=${java.io.tmpdir}/sgtc-test-uploads
